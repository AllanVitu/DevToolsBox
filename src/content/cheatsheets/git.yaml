id: git
title: Git
icon: git-branch
summary: Les commandes du quotidien et comment réparer ses erreurs.
category: cli
keywords:
  - git
  - commit
  - branche
  - merge
  - rebase
  - stash
  - reset
groups:
  - title: Démarrer & enregistrer
    items:
      - code: git init
        desc: Initialiser un dépôt dans le dossier courant.
      - code: git status
        desc: Voir les fichiers modifiés / indexés.
      - code: git add <fichier>
        desc: Indexer un fichier (`.` pour tout).
      - code: git commit -m "msg"
        desc: Enregistrer un point dans l’historique.
      - code: git log --oneline
        desc: Historique condensé, une ligne par commit.
  - title: Branches & fusion
    items:
      - code: git switch -c <nom>
        desc: Créer une branche et s’y placer.
      - code: git switch <nom>
        desc: Changer de branche.
      - code: git merge <nom>
        desc: Fusionner une branche dans la courante.
      - code: git branch -d <nom>
        desc: Supprimer une branche fusionnée.
  - title: Dépôt distant
    items:
      - code: git clone <url>
        desc: Copier un dépôt existant.
      - code: git pull
        desc: Récupérer et fusionner les changements distants.
      - code: git push -u origin <br>
        desc: Publier la branche et la suivre.
  - title: Annuler / réparer
    items:
      - code: git restore <fichier>
        desc: Annuler les modifications non indexées.
      - code: git restore --staged <f>
        desc: Désindexer sans perdre les changements.
      - code: git commit --amend
        desc: Corriger le dernier commit.
      - code: git reset --soft HEAD~1
        desc: Annuler le dernier commit, garder le code.
      - code: git stash
        desc: Mettre de côté les changements en cours.
