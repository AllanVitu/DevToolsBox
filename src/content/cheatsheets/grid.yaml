id: grid
title: CSS Grid
icon: layout-grid
summary: Mises en page en deux dimensions.
category: web
keywords:
  - css
  - grid
  - grille
  - colonnes
  - lignes
  - layout
groups:
  - title: Définir la grille
    items:
      - code: 'display: grid'
        desc: Active la grille.
      - code: 'grid-template-columns: 1fr 1fr'
        desc: Deux colonnes égales (`fr` = fraction).
      - code: repeat(auto-fill, minmax(220px, 1fr))
        desc: Colonnes responsives sans media query.
      - code: 'gap: 1rem'
        desc: Espace entre les cellules.
  - title: Placer les éléments
    items:
      - code: 'grid-column: span 2'
        desc: Occuper 2 colonnes.
      - code: 'grid-row: 1 / 3'
        desc: De la ligne 1 à la ligne 3.
      - code: 'place-items: center'
        desc: Centrer dans chaque cellule.
